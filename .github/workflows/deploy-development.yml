name: Deploy development

on:
  workflow_dispatch:
    inputs:
      provision_foundry_agents:
        description: "Provision role-scoped Foundry Agents after Foundry User access has been granted"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write


concurrency:
  group: development
  cancel-in-progress: false

jobs:
  deploy:
    environment: development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_MANAGED_IDENTITY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
      - name: Bootstrap protected Terraform state
        shell: bash
        run: |
          az storage account create \
            --name stmmaugtfstate9a2ab22e \
            --resource-group rg_mmaug_high_school \
            --location northeurope \
            --sku Standard_LRS \
            --min-tls-version TLS1_2 \
            --allow-blob-public-access false \
            --tags project=mmaug-secure-login-portal environment=development managed-by=github-oidc \
            --output none
          state_key="$(az storage account keys list --resource-group rg_mmaug_high_school --account-name stmmaugtfstate9a2ab22e --query '[0].value' --output tsv)"
          echo "::add-mask::$state_key"
          az storage container create --name tfstate --account-name stmmaugtfstate9a2ab22e --account-key "$state_key" --output none
          echo "ARM_ACCESS_KEY=$state_key" >> "$GITHUB_ENV"
      - name: Terraform init
        working-directory: infra
        run: >-
          terraform init
          -backend-config="resource_group_name=rg_mmaug_high_school"
          -backend-config="storage_account_name=stmmaugtfstate9a2ab22e"
          -backend-config="container_name=tfstate"
          -backend-config="key=development.tfstate"
      - name: Terraform validate
        working-directory: infra
        run: terraform validate
      - name: Terraform apply
        working-directory: infra
        env:
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
          TF_VAR_entra_api_client_id: ${{ vars.ENTRA_API_CLIENT_ID || '00000000-0000-0000-0000-000000000000' }}
          TF_VAR_entra_spa_client_id: ${{ vars.ENTRA_SPA_CLIENT_ID || '00000000-0000-0000-0000-000000000000' }}
          TF_VAR_azure_ai_model_deployment_name: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME || 'gpt-5.4-mini' }}
          TF_VAR_azure_ad_client_id: ${{ secrets.AZURE_AD_CLIENT_ID }}
          TF_VAR_azure_ad_client_secret: ${{ secrets.AZURE_AD_CLIENT_SECRET }}
          TF_VAR_azure_ad_tenant_id: ${{ secrets.AZURE_AD_TENANT_ID }}
        run: terraform apply -auto-approve

      - name: Wait for App Service configuration restart
        run: sleep 90

      - name: Publish approved knowledge base
        working-directory: infra
        shell: bash
        run: |
          storage_account="$(terraform output -raw knowledge_base_storage_account_name)"
          container="$(terraform output -raw knowledge_base_container_name)"
          storage_key="$(az storage account keys list --resource-group rg_mmaug_high_school --account-name "$storage_account" --query '[0].value' --output tsv)"
          echo "::add-mask::$storage_key"
          az storage blob upload-batch \
            --account-name "$storage_account" \
            --account-key "$storage_key" \
            --destination "$container" \
            --source ../knowledge-base \
            --overwrite \
            --output none

      - name: Capture deployment URLs
        working-directory: infra
        shell: bash
        env:
          AZURE_MANAGED_IDENTITY_CLIENT_ID: ${{ vars.AZURE_MANAGED_IDENTITY_CLIENT_ID }}
        run: |
          runtime_client_id="$(terraform output -raw runtime_identity_client_id)"
          if [[ "$runtime_client_id" != "$AZURE_MANAGED_IDENTITY_CLIENT_ID" ]]; then
            echo "::error::GitHub deployment identity must match the API runtime managed identity."
            exit 1
          fi
          echo "API_APP_NAME=$(terraform output -raw api_app_name)" >> "$GITHUB_ENV"
          echo "FRONTEND_APP_NAME=$(terraform output -raw frontend_app_name)" >> "$GITHUB_ENV"
          echo "API_APP_URL=$(terraform output -raw api_url)" >> "$GITHUB_ENV"
          echo "FRONTEND_APP_URL=$(terraform output -raw frontend_url)" >> "$GITHUB_ENV"
          echo "FOUNDRY_PROJECT_ENDPOINT=$(terraform output -raw foundry_project_endpoint)" >> "$GITHUB_ENV"
          echo "FOUNDRY_MODEL_DEPLOYMENT_NAME=$(terraform output -raw foundry_model_deployment_name)" >> "$GITHUB_ENV"
          echo "FOUNDRY_AGENT_ACCOUNT_NAME=$(terraform output -raw foundry_agent_account_name)" >> "$GITHUB_ENV"
          echo "FOUNDRY_AGENT_PROJECT_NAME=$(terraform output -raw foundry_agent_project_name)" >> "$GITHUB_ENV"
          echo "FOUNDRY_AGENT_PROJECT_RESOURCE_ID=$(terraform output -raw foundry_agent_project_resource_id)" >> "$GITHUB_ENV"
          echo "RUNTIME_IDENTITY_PRINCIPAL_ID=$(terraform output -raw runtime_identity_principal_id)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Foundry provisioning SDK
        run: python -m pip install "azure-ai-projects>=2.10,<3"
      - name: Provision role-scoped Foundry Agents and File Search
        if: inputs.provision_foundry_agents
        env:
          FOUNDRY_PROJECT_ENDPOINT: ${{ env.FOUNDRY_PROJECT_ENDPOINT }}
          FOUNDRY_MODEL_DEPLOYMENT_NAME: ${{ env.FOUNDRY_MODEL_DEPLOYMENT_NAME }}
        run: python scripts/provision-foundry-agents.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build deployment packages
        env:
          VITE_ENTRA_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          VITE_ENTRA_AUTHORITY_TENANT: common
          VITE_ENTRA_SPA_CLIENT_ID: ${{ vars.ENTRA_SPA_CLIENT_ID || '00000000-0000-0000-0000-000000000000' }}
          VITE_ENTRA_API_CLIENT_ID: ${{ vars.ENTRA_API_CLIENT_ID || '00000000-0000-0000-0000-000000000000' }}
          VITE_API_BASE_URL: ${{ env.API_APP_URL }}
          VITE_DEV_AUTH: "false"
        run: |
          python -m pip install --no-compile --requirement backend/requirements.txt --target backend/.python_packages/lib/site-packages
          cp -R knowledge-base backend/knowledge-base
          (cd backend && zip -qr ../backend.zip app migrations alembic.ini requirements.txt .python_packages knowledge-base \
            -x '*/__pycache__/*' '*/__pycache__/' '*.pyc' '*.pyo')
          echo "Backend package size: $(du -h backend.zip | cut -f1)"
          echo "Backend package entries: $(unzip -Z1 backend.zip | wc -l)"
          if unzip -Z1 backend.zip | grep -Eq '(^|/)__pycache__/|\.py[co]$'; then
            echo "::error::Backend package contains generated Python bytecode."
            exit 1
          fi
          (cd frontend && npm ci && npm run build && cd dist && zip -r ../../frontend.zip .)

      - name: Deploy API
        run: >-
          az webapp deploy
          --resource-group rg_mmaug_high_school
          --name "$API_APP_NAME"
          --src-path backend.zip
          --type zip
          --clean true
          --restart true
          --track-status true
      - name: Deploy frontend
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.FRONTEND_APP_NAME }}
          package: frontend.zip
      - name: Verify health
        env:
          PROVISION_FOUNDRY_AGENTS: ${{ inputs.provision_foundry_agents }}
        run: |
          curl --fail --retry 60 --retry-delay 10 --retry-all-errors --max-time 20 "$API_APP_URL/health/ready"
          curl --fail --retry 30 --retry-delay 10 --retry-all-errors --max-time 20 "$FRONTEND_APP_URL/"
          if [[ "$PROVISION_FOUNDRY_AGENTS" == "true" ]]; then
            # The first agent request after a zip deployment can include both an
            # App Service cold start and Foundry token acquisition. Retry a timed-
            # out first request, but keep every attempt bounded.
            response="$(curl --fail --retry 2 --retry-all-errors --retry-delay 10 --max-time 70 \
              -H 'Content-Type: application/json' \
              -d '{"message":"Who can use the portal?"}' \
              "$API_APP_URL/api/agent/public")"
            echo "$response" | jq .
            echo "$response" | jq -e '.mode == "foundry"' >/dev/null
          fi
          {
            echo "### Development deployment"
            echo "- Frontend URL: $FRONTEND_APP_URL"
            echo "- API URL: $API_APP_URL"
            echo "- Foundry Agent provisioning requested: $PROVISION_FOUNDRY_AGENTS"
            echo "- Foundry account: $FOUNDRY_AGENT_ACCOUNT_NAME"
            echo "- Foundry project: $FOUNDRY_AGENT_PROJECT_NAME"
            echo "- Foundry project resource ID: $FOUNDRY_AGENT_PROJECT_RESOURCE_ID"
            echo "- Runtime identity principal ID: $RUNTIME_IDENTITY_PRINCIPAL_ID"
            echo "- MSAL status: pending administrator app registrations"
          } >> "$GITHUB_STEP_SUMMARY"
