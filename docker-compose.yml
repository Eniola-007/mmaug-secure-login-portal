services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mmaug_portal
      POSTGRES_USER: mmaug
      POSTGRES_PASSWORD: mmaug-local-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmaug -d mmaug_portal"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
