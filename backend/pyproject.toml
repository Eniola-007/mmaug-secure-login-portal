[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mmaug-secure-login-api"
version = "0.1.0"
description = "Protected API for the MMAUG High School portal"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "PyJWT[crypto]>=2.10,<3",
  "httpx>=0.28,<1",
  "email-validator>=2.2,<3",
  "azure-identity>=1.19,<2",
  "azure-ai-projects>=2,<3",
  "azure-keyvault-secrets>=4.9,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "B008", # FastAPI uses dependency calls in parameter defaults by design.
  "S101",
]
