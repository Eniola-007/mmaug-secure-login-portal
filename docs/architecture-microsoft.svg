<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MMAUG Secure Login Portal Azure architecture</title>
  <desc id="desc">Microsoft-style architecture showing GitHub OIDC deployment, administrator Entra handoff, App Service, VNet, PostgreSQL role mapping, Foundry role agents, private knowledge-base storage, and monitoring.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6b7a"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity=".14"/></filter>
    <style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#243a5e}.title{font-size:34px;font-weight:700}.subtitle{font-size:17px;fill:#5b6b7a}.group{fill:#f7f9fc;stroke:#9bb7d3;stroke-width:2}.card{fill:#fff;stroke:#8aa8c2;stroke-width:2;filter:url(#shadow)}.azure{fill:#0078d4}.identity{fill:#5c2d91}.security{fill:#107c10}.data{fill:#d83b01}.label{font-size:19px;font-weight:700}.small{font-size:14px;fill:#5b6b7a}.white{fill:#fff}.line{fill:none;stroke:#5b6b7a;stroke-width:3;marker-end:url(#arrow)}.dash{stroke-dasharray:9 7}.phase{font-size:15px;font-weight:700;fill:#0078d4}</style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="55" y="60" class="title">MMAUG Secure Login Portal</text><text x="55" y="90" class="subtitle">Identity, PostgreSQL roles, guarded Foundry assistants, and approved school knowledge</text>
  <rect x="45" y="135" width="300" height="700" rx="18" class="group"/><text x="70" y="175" class="label">External services</text>
  <g transform="translate(75 220)"><rect width="240" height="100" rx="12" class="card"/><rect width="18" height="100" rx="9" class="azure"/><text x="40" y="43" class="label">GitHub Actions</text><text x="40" y="70" class="small">development environment</text></g>
  <g transform="translate(75 390)"><rect width="240" height="100" rx="12" class="card"/><rect width="18" height="100" rx="9" class="identity"/><text x="40" y="43" class="label">Entra administrator</text><text x="40" y="70" class="small">app registrations + consent</text></g>
  <g transform="translate(75 610)"><rect width="240" height="100" rx="12" class="card"/><rect width="18" height="100" rx="9" class="security"/><text x="40" y="43" class="label">Portal users</text><text x="40" y="70" class="small">work, school, guest, personal</text></g>
  <rect x="390" y="135" width="1165" height="700" rx="18" class="group"/><text x="420" y="175" class="label">Azure · North Europe · project resource group</text><text x="420" y="205" class="phase">PHASE 1 · DEPLOY AND RETURN WEB APP URL</text>
  <g transform="translate(420 235)"><rect width="260" height="105" rx="12" class="card"/><rect width="260" height="32" rx="12" class="azure"/><text x="18" y="23" class="white" font-size="15" font-weight="700">MANAGED IDENTITY</text><text x="20" y="64" class="label">Approved UAMI</text><text x="20" y="89" class="small">Contributor · OIDC · no secret</text></g>
  <g transform="translate(745 235)"><rect width="260" height="105" rx="12" class="card"/><rect width="260" height="32" rx="12" class="azure"/><text x="18" y="23" class="white" font-size="15" font-weight="700">AZURE RESOURCE MANAGER</text><text x="20" y="64" class="label">Terraform deployment</text><text x="20" y="89" class="small">remote encrypted state</text></g>
  <g transform="translate(1070 235)"><rect width="430" height="105" rx="12" class="card"/><rect width="430" height="32" rx="12" class="azure"/><text x="18" y="23" class="white" font-size="15" font-weight="700">APP SERVICE PLAN · LINUX B1</text><text x="20" y="64" class="label">React Web App + FastAPI Web App</text><text x="20" y="89" class="small">direct HTTPS URL returned for Entra configuration</text></g>
  <text x="420" y="405" class="phase">PHASE 2 · ADMIN CONFIGURES MSAL · PORTAL ENFORCES DATABASE ROLES</text>
  <g transform="translate(420 440)"><rect width="260" height="110" rx="12" class="card"/><rect width="260" height="32" rx="12" class="identity"/><text x="18" y="23" class="white" font-size="15" font-weight="700">MICROSOFT ENTRA ID</text><text x="20" y="65" class="label">SPA + API registrations</text><text x="20" y="92" class="small">PKCE · access_as_user · consent</text></g>
  <g transform="translate(745 440)"><rect width="260" height="110" rx="12" class="card"/><rect width="260" height="32" rx="12" class="security"/><text x="18" y="23" class="white" font-size="15" font-weight="700">APPLICATION GATEWAY</text><text x="20" y="65" class="label">WAF_v2 + HTTPS</text><text x="20" y="92" class="small">OWASP 3.2 Prevention · /api/*</text></g>
  <g transform="translate(1070 440)"><rect width="205" height="110" rx="12" class="card"/><rect width="205" height="32" rx="12" class="security"/><text x="18" y="23" class="white" font-size="15" font-weight="700">KEY VAULT</text><text x="20" y="65" class="label">Secrets + TLS</text><text x="20" y="92" class="small">managed identity access</text></g>
  <g transform="translate(1295 440)"><rect width="205" height="110" rx="12" class="card"/><rect width="205" height="32" rx="12" class="data"/><text x="18" y="23" class="white" font-size="15" font-weight="700">POSTGRESQL</text><text x="20" y="65" class="label">Private B1ms</text><text x="20" y="92" class="small">enrollment + roles + audit</text></g>
  <g transform="translate(420 650)"><rect width="260" height="105" rx="12" class="card"/><rect width="260" height="32" rx="12" class="identity"/><text x="18" y="23" class="white" font-size="15" font-weight="700">MICROSOFT FOUNDRY</text><text x="20" y="65" class="label">GPT-5.4 mini agents</text><text x="20" y="90" class="small">student · teacher · administrator</text></g>
  <g transform="translate(745 650)"><rect width="260" height="105" rx="12" class="card"/><rect width="260" height="32" rx="12" class="data"/><text x="18" y="23" class="white" font-size="15" font-weight="700">AZURE BLOB STORAGE</text><text x="20" y="65" class="label">Approved knowledge base</text><text x="20" y="90" class="small">private container · curated files</text></g>
  <g transform="translate(1070 650)"><rect width="430" height="105" rx="12" class="card"/><rect width="430" height="32" rx="12" class="azure"/><text x="18" y="23" class="white" font-size="15" font-weight="700">AZURE MONITOR</text><text x="20" y="65" class="label">Application Insights + Log Analytics</text><text x="20" y="90" class="small">health, agent audit, telemetry, diagnostics</text></g>
  <path d="M315 270H420" class="line"/><text x="332" y="255" class="small">OIDC</text><path d="M680 287H745" class="line"/><path d="M1005 287H1070" class="line"/>
  <path d="M315 440H420" class="line dash"/><text x="330" y="425" class="small">URL + client IDs</text><path d="M680 495H745" class="line dash"/><text x="690" y="478" class="small">MSAL</text>
  <path d="M315 660H745V550" class="line"/><text x="460" y="645" class="small">HTTPS sign-in and portal traffic</text><path d="M1005 495H1070" class="line"/><path d="M1005 510H1295" class="line"/><path d="M1285 550V650" class="line"/>
  <path d="M1200 340V605H550V650" class="line dash"/><text x="820" y="595" class="small">role-scoped assistant request</text><path d="M680 702H745" class="line"/>
  <rect x="420" y="785" width="1080" height="30" rx="8" fill="#e8f3fb"/><text x="440" y="806" class="small">Guardrail boundary: PostgreSQL assigns the role; Foundry receives no role from the browser and has no state-changing tools.</text>
</svg>
