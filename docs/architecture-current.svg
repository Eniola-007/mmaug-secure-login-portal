  <rect x="45" y="950" width="1710" height="68" rx="12" class="note"/><text x="70" y="980" class="label">Authorization and safety boundary</text><text x="70" y="1004" class="small">FastAPI verifies the identity, active status and PostgreSQL role on every protected request. Authentication never selects a role; the browser cannot grant access, and the assistant cannot change school records.</text>
