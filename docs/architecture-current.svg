  <g transform="translate(75 435)"><rect width="250" height="135" rx="12" class="card"/><rect width="250" height="48" rx="12" class="bandGitHub"/><use href="#i-pipeline" x="12" y="7" width="34" height="34" class="icon"/><text x="56" y="30" class="cardTitle">GITHUB ACTIONS</text><text x="20" y="82" class="label">CI/CD environment</text><text x="20" y="106" class="small">OIDC · Terraform · zip deploy</text><text x="20" y="125" class="tiny">No Azure deployment secret</text></g>
  <g transform="translate(75 650)"><rect width="250" height="135" rx="12" class="card"/><rect width="250" height="48" rx="12" class="band"/><use href="#i-identity" x="12" y="7" width="34" height="34" class="icon"/><text x="56" y="30" class="cardTitle">SCHOOL ADMINISTRATOR</text><text x="20" y="82" class="label">People and access</text><text x="20" y="106" class="small">Approve · invite · assign DB role</text><text x="20" y="125" class="tiny">Audit and account lifecycle</text></g>
