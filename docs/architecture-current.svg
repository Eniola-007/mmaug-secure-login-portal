  <g transform="translate(1180 445)"><rect width="270" height="145" rx="12" class="card"/><rect width="270" height="48" rx="12" class="bandSecurity"/><use href="#i-mail" x="12" y="7" width="34" height="34" class="icon"/><text x="56" y="30" class="cardTitle">COMMUNICATION SERVICES</text><text x="20" y="82" class="label">Account email</text><text x="20" y="106" class="small">Verification · invites · recovery</text><text x="20" y="126" class="tiny">Managed-identity authentication</text></g>
  <g transform="translate(1510 445)"><rect width="210" height="145" rx="12" class="card"/><rect width="210" height="48" rx="12" class="bandMonitor"/><use href="#i-monitor" x="12" y="7" width="34" height="34" class="icon"/><text x="56" y="30" class="cardTitle">AZURE MONITOR</text><text x="20" y="82" class="label">Observability</text><text x="20" y="106" class="small">App Insights · logs</text><text x="20" y="126" class="tiny">Health · requests · traces</text></g>
  <g transform="translate(1180 650)"><rect width="540" height="160" rx="12" class="card"/><rect width="540" height="48" rx="12" class="bandAi"/><use href="#i-bot" x="12" y="7" width="34" height="34" class="icon"/><text x="56" y="30" class="cardTitle">GUARDED ROLE ASSISTANT · SAFE FALLBACK</text><text x="20" y="82" class="label">Visitor, Student, Teacher and Administrator guidance</text><text x="20" y="107" class="small">Server selects the role · reviewed local knowledge · no state-changing tools</text><text x="20" y="129" class="small">Prompt-injection, secret, cross-user and privileged-action checks</text><text x="20" y="149" class="tiny">Works without a model call while Foundry runtime authorization is outside the active path</text></g>
