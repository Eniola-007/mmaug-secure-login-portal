  <rect x="35" y="1080" width="1850" height="82" rx="13" class="note"/>
  <text x="60" y="1112" class="label">Authorization and trust boundary</text>
  <text x="60" y="1138" class="small">FastAPI validates identity and account state, reads the active role from PostgreSQL, applies guardrails, and selects one fixed Foundry agent. The browser and model cannot grant a role or perform privileged school actions.</text>
