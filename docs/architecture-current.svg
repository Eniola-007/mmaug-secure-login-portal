<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">MMAUG Secure Login Portal — current working Azure architecture</title>
  <desc id="desc">Microsoft-style current-state architecture showing only the working App Service HTTPS path, GitHub OIDC delivery, managed identity, private PostgreSQL, Key Vault, email, monitoring and guarded role assistant.</desc>
