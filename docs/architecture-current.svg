    <symbol id="i-network" viewBox="0 0 48 48"><circle cx="24" cy="9" r="5"/><circle cx="9" cy="38" r="5"/><circle cx="39" cy="38" r="5"/><path d="M22 14L11 33M26 14l11 19M14 38h20"/></symbol>
