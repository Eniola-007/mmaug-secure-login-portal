  <g transform="translate(790 220)"><rect width="320" height="145" rx="12" class="card"/><rect width="320" height="48" rx="12" class="band"/><use href="#i-api" x="12" y="7" width="34" height="34" class="icon"/><text x="56" y="30" class="cardTitle">AZURE APP SERVICE</text><text x="20" y="82" class="label">FastAPI security boundary</text><text x="20" y="106" class="small">Authentication · RBAC · audit · rate limits</text><text x="20" y="126" class="tiny">Email and assistant orchestration</text></g>
  <g transform="translate(1180 220)"><rect width="270" height="145" rx="12" class="card"/><rect width="270" height="48" rx="12" class="bandIdentity"/><use href="#i-identity" x="12" y="7" width="34" height="34" class="icon"/><text x="56" y="30" class="cardTitle">MANAGED IDENTITY</text><text x="20" y="82" class="label">Single approved identity</text><text x="20" y="106" class="small">GitHub OIDC + API runtime</text><text x="20" y="126" class="tiny">id-mmaug-secure-login-portal</text></g>
  <g transform="translate(1510 220)"><rect width="210" height="145" rx="12" class="card"/><rect width="210" height="48" rx="12" class="bandSecurity"/><use href="#i-key" x="12" y="7" width="34" height="34" class="icon"/><text x="56" y="30" class="cardTitle">KEY VAULT</text><text x="20" y="82" class="label">Secret references</text><text x="20" y="106" class="small">DB URL · JWT value</text><text x="20" y="126" class="tiny">Not exposed to browser</text></g>
  <rect x="430" y="445" width="680" height="285" rx="16" class="network"/><use href="#i-network" x="450" y="464" width="35" height="35" fill="none" stroke="#0078d4" stroke-width="2.4"/><text x="495" y="486" class="section">PRIVATE DATA NETWORK</text><text x="455" y="515" class="tiny">VNet integration · delegated database subnet · private DNS · no public database endpoint</text>
  <g transform="translate(465 550)"><rect width="250" height="135" rx="12" class="card"/><rect width="250" height="48" rx="12" class="band"/><use href="#i-network" x="12" y="7" width="34" height="34" class="icon"/><text x="56" y="30" class="cardTitle">APP SERVICE SUBNET</text><text x="20" y="82" class="label">API VNet integration</text><text x="20" y="106" class="small">Private route to PostgreSQL</text><text x="20" y="126" class="tiny">snet-appservice</text></g>
